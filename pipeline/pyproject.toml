[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmia-pipeline"
version = "0.1.0"
description = "Collects public LMIA records and builds the LMIA Watch database."
requires-python = ">=3.11"
license = { text = "Source-available; see LICENSE.md at the repository root" }
dependencies = [
  "requests>=2.31",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "requests-oauthlib>=1.3",
  "pillow>=10",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
geo = ["pyshp>=2.3", "pyproj>=3.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lmia_pipeline*"]

[tool.setuptools.package-data]
lmia_pipeline = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
