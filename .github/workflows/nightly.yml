# Triggers: a scheduled run at midnight UTC, two retry schedules at 06:00 and
# 12:00 UTC, and a manual run (the Actions tab, repository writers only) for
# re-running a night on the newest code; a re-run of an old run keeps its old
# commit. The pipeline refuses a second Job Bank pass within 20 hours of a
# complete one, so neither a retry nor a manual run crawls twice in a day.
# There is no push trigger, and nothing on the site can start a run. Code on
# main ships with the next run, because this job deploys the Worker from the
# checked-out tree after the data stage.
#
# The retry rule (job "gate"): the midnight schedule and a manual run always
# go on to the refresh. At 06:00 and 12:00 the gate downloads status.json from
# R2 and skips the refresh only when it shows a run that finished today (UTC)
# with ok true and the deploy step's outcome success; anything else, a status
# it cannot download or read included, runs the refresh again. So a GitHub
# delay, a runner fault or a Cloudflare API error is retried the same day with
# no one involved, and a clean day costs two gate jobs of a minute each.
#
# Steps: restore the SQLite file from R2, run every pipeline stage (the
# pipeline itself skips Job Bank if it already ran within the last 20 hours,
# and the same for the pass over postings open to international candidates;
# the stages include IRCC's high-wage list, adopted when it changes, and the
# designated-employer lists; their changes of state are notices in the run status),
# check the database and the export, send the changed rows to the search
# database (D1 lmia-watch-search), record the Worker version serving traffic,
# deploy the Worker with that data as its assets, check the live site and roll
# the Worker back when the deploy broke it, tell IndexNow which pages changed,
# post the daily digest to X and to Bluesky when their secrets exist, deposit
# a new ESDC quarter on Zenodo when its token exists, save the database and the public files back to R2, keep
# the audience counts of the finished days in R2 when the analytics token
# exists, append Search Console's daily figures when its key exists, write
# the monthly audience report on the first run of a month, run the monthly
# expiry checks on the first of a month, write the run status, and report the
# items needing attention (failed run, one GitHub issue).
#
# What a failure does (lmia_pipeline/nightly.py and resilience.py hold the
# checks):
# - A backup that exists but cannot be downloaded or used stops the run before
#   the pipeline, so an empty database never rebuilds the site and never
#   replaces the backup. A damaged newest backup falls back to the previous
#   one; when both nightly files are missing or damaged, to the newest weekly
#   snapshot (an attention item, since the days after it are lost); only when
#   nothing exists anywhere does the run start from nothing.
# - A deploy after which the site answers 500 to 599 twice is rolled back to
#   the version recorded before it (deploy_rolled_back: true, an attention
#   item); the database is still saved, and the next retry deploys again. An
#   answer from the edge (403, a challenge page) proves nothing and changes
#   nothing.
# - A stage that fails is recorded and the run goes on; the export is checked
#   before it is deployed, so broken or empty data is never published and the
#   site keeps its last good deploy.
# - The database is checked before it is saved, and last night's backup is
#   kept as the previous one before it is replaced.
# - The status file is written whatever happened, so the site's daily check
#   always has something current to read.
# - A search database sync that fails is reported (search_sync: failed) and
#   sent again the next night; it never stops the run.
# - An audience roll-up that fails is reported (views_rollup: failed) and
#   caught up the next night; it never stops the run, and a summary that
#   could not be downloaded is never replaced. The same holds for the Search
#   Console import (search_console: failed) and its file, and for the monthly
#   report (views_report: failed), which the next run writes instead.
# - An IndexNow submission that fails is reported (indexnow in the run status)
#   and never stops the run; only a rejection (the key file or the payload is
#   wrong) is an item needing attention.
# - A designated-employer list read from its copy loaded by hand (Nova Scotia;
#   registers/aip_ns.csv and .json in this bucket, read by the registers stage
#   with this job's token, never in the repository) whose publisher links or
#   serves a newer edition, or whose copy does not read, is an item needing
#   attention (registers.attention in the run status): the copy's rows stand
#   in meanwhile, the run stays ok and no retry follows; loading the new
#   edition by hand clears it. No copy in R2 is a failed read like any other.
# - A fault in the retry gate, the version record, the smoke test, the expiry
#   checks or the issue update never stops the run: the gate then runs the
#   refresh, a missing version means no rollback tonight, and each outcome is
#   in status.json.
# - A notice (a government notice first listed tonight; IRCC's high-wage list
#   adopted after a change, or unreadable from tonight or readable again; a
#   designated-employer list or a news feed that stops being read or is read
#   again) is information, never an item needing attention: it goes to
#   status.json's notices, LAST_RUN.md and the daily check's email, never fails
#   the last step or opens the issue, and leaves the run ok, so no retry
#   follows: a retry would read the same page again.
#
# Secrets on the project account: CLOUDFLARE_API_TOKEN (Workers + R2 + D1),
# CLOUDFLARE_ACCOUNT_ID. Optional: X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN,
# X_ACCESS_TOKEN_SECRET (the X post; without them the step does nothing);
# BSKY_HANDLE, BSKY_APP_PASSWORD (the Bluesky post, docs/bluesky-account.md);
# ZENODO_TOKEN (the Zenodo deposit, docs/zenodo.md);
# CLOUDFLARE_ANALYTICS_TOKEN (Account Analytics Read only, the audience
# roll-up, docs/search-engines.md section 6; without it the step does nothing);
# GSC_SERVICE_ACCOUNT_JSON (a Google service account's JSON key, added as a
# user of the Search Console property; without it the import reports "no
# credentials"). The Worker secret VIEWS_SALT_KEY (the daily visitor code) is
# set with wrangler, not here; the roll-up counts no unique visitors without it.
# Variables: SITE_URL, CONTACT (the scraper's user agent); X_POST_ENABLED must be
# "true" for the X step to run at all (X posting is pay-per-use, so it is opt-in);
# optional X_POST_LINK, set to true to put the site link in the text (X bills a
# post with a link at thirteen times the rate; the attached card carries the
# address instead); BSKY_POST_ENABLED must be "true" for the Bluesky step;
# optional ZENODO_SANDBOX, set to true to deposit on sandbox.zenodo.org (test
# DOIs that never reach the site) instead of zenodo.org; optional
# INDEXNOW_ENABLED, set to false to stop the IndexNow submission (it runs
# unless the variable reads exactly "false"; the key is in the code, so it
# needs no secret); optional GSC_SITE, the Search Console property when it is
# not the domain property sc-domain:<site host>.
# The repository is public, so Actions minutes are unlimited; the only pace
# limit is Job Bank's five-second crawl delay, which puts a full sweep at a
# few hours. The job must finish before the next midnight run.

name: nightly

on:
  schedule:
    - cron: "0 0 * * *"
    # Retries, which the gate job skips when today's run finished clean.
    # The midnight entry above must stay exactly "0 0 * * *": the gate
    # tells the schedules apart by that string.
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

# contents: write only so a step can record the run date; GitHub pauses a
# schedule after 60 days without repository activity. issues: write for the
# one run-attention issue the last step opens, updates and closes.
permissions:
  contents: write
  issues: write

# Never let two runs overlap, even if one is delayed past the next schedule.
# A retry queued behind a long run waits for it, then its gate reads the
# status that run wrote. deploy-site.yml uses the same group, so a site-only
# deploy never runs during a refresh (pipeline/tests/test_site_deploy.py
# checks that both keep it).
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Decides whether this trigger has anything to do (the retry rule in the
  # header). Every step that could fail is allowed to: a gate that cannot
  # decide leaves skip unset, and the refresh runs. The download uses the
  # site's pinned Wrangler like every other R2 read.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RETRY: ${{ github.event_name == 'schedule' && github.event.schedule != '0 0 * * *' }}
      WRANGLER: ${{ github.workspace }}/site/node_modules/.bin/wrangler
      BUCKET: lmia-watch-data
    steps:
      - name: Midnight or manual run, so the refresh goes ahead
        if: ${{ env.RETRY != 'true' }}
        run: echo "Not a retry trigger; the refresh runs."
      - uses: actions/checkout@v4
        if: ${{ env.RETRY == 'true' }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        if: ${{ env.RETRY == 'true' }}
        continue-on-error: true
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        if: ${{ env.RETRY == 'true' }}
        continue-on-error: true
        with:
          node-version: "22"
      - name: Install the site's tools
        if: ${{ env.RETRY == 'true' }}
        continue-on-error: true
        working-directory: site
        run: npm ci
      # nightly.py needs nothing beyond the standard library for the gate,
      # so the pipeline is not installed here.
      - name: Read today's run status from R2
        id: decide
        if: ${{ env.RETRY == 'true' }}
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          mkdir -p data/gate
          if ! "$WRANGLER" r2 object get --remote "$BUCKET/status.json" --file data/gate/status.json > data/gate/get.log 2>&1; then
            echo "status.json could not be downloaded, so the refresh runs:"
            cat data/gate/get.log
            rm -f data/gate/status.json
          fi
          python -m lmia_pipeline.nightly gate --status data/gate/status.json --today "$(date -u +%Y-%m-%d)"

  refresh:
    needs: gate
    # Runs unless the gate found today's run already clean. !cancelled()
    # rather than the implied success(), so a gate job that failed outright
    # skips nothing.
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # GitHub ends a hosted job at six hours whatever this says, and a job
    # ended that way skips the deploy, the backup and the status file. The
    # Job Bank stage caps itself at four hours so the rest always fits.
    timeout-minutes: 350
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LMIAWATCH_SITE_URL: ${{ vars.SITE_URL }}
      LMIAWATCH_CONTACT: ${{ vars.CONTACT }}
      # The site's pinned Wrangler (package-lock.json) for every R2 call as well
      # as the deploy, so a new Wrangler release cannot change how the backup
      # is read or written. Installed by the "site's tools" step.
      WRANGLER: ${{ github.workspace }}/site/node_modules/.bin/wrangler
      BUCKET: lmia-watch-data
    steps:
      # Fail in seconds, not after an hour of crawling, until the account is wired up.
      - name: Check that the Cloudflare secrets exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; nothing to do."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Editable, because config.py finds schema.sql and data/ relative to its own
      # file; a regular install would look for them inside site-packages.
      - name: Install the pipeline
        run: pip install -e ./pipeline
      - name: Install the site's tools
        working-directory: site
        run: npm ci

      # The download cache (ESDC files, the federal extract, the wage tables, the
      # LFS table, the boundaries) persists between runs through the Actions
      # cache, so weekly and monthly revalidation means what it says instead
      # of a fresh download every night. A new key each run saves the latest
      # state; restore-keys picks the newest previous one. Restore and save are
      # separate steps so the cache is saved even on a night that reports a
      # failure; a cache service fault only costs a fresh download.
      - name: Restore the download cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/raw/cache
          key: raw-cache-${{ github.run_id }}
          restore-keys: raw-cache-

      # The database travels gzipped and without its secondary indexes (the
      # save step's pack): the raw file is above the single-object size the
      # command-line upload accepts. The pipeline puts the indexes back when it
      # first opens the restored file, in seconds.
      # --remote on every r2 command: without it Wrangler 4 reads and writes a
      # local simulated bucket on the runner, which is thrown away with the job.
      # Each download is tried three times; "does not exist" ends the tries,
      # since that is an answer, not an outage. The restore command decides.
      # When R2 answered that both nightly files are missing or they are both
      # damaged, the command itself lists backups/weekly/ through the R2 REST
      # API (Wrangler has no listing command) with CLOUDFLARE_API_TOKEN from
      # the job's environment, downloads the newest db-slot snapshot the same
      # way, and records source "weekly" and its upload time in restore.json.
      - name: Restore the database from R2
        id: restore
        run: |
          mkdir -p data/restore data/out
          fetch() {
            key="$1"
            for attempt in 1 2 3; do
              if "$WRANGLER" r2 object get --remote "$BUCKET/$key" --file "data/restore/$key" > "data/restore/$key.log" 2>&1; then
                echo 0 > "data/restore/$key.exit"
                return 0
              fi
              echo 1 > "data/restore/$key.exit"
              if grep -qi "specified key does not exist" "data/restore/$key.log"; then return 0; fi
              sleep 20
            done
          }
          fetch lmia.sqlite.gz
          fetch lmia.sqlite.prev.gz
          python -m lmia_pipeline.nightly restore --dir data/restore --db data/lmia.sqlite --out data/out/restore.json \
            --bucket "$BUCKET"

      # 150 posting pages a night, at Job Bank's pace with an 8-second gap between
      # requests: well inside the Job Bank stage's four-hour cap, and fewer
      # requests from one address in one night. The pass over postings open to
      # international candidates reads up to 400 more (about 55 minutes, inside
      # its 90-minute cap; newest first, so a posting that appears tonight is
      # graded tonight and the backlog of the first sweep drains behind it),
      # plus a weekly sweep of every page of that filter (about 45 minutes).
      # A non-zero exit marks the run failed, and the steps below still check
      # and save what the run produced.
      - name: Run every stage
        id: pipeline
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/out/run_started.txt
          python -m lmia_pipeline run --db data/lmia.sqlite --detail-budget 150 --intl-detail-budget 400

      - name: Check the database and the export
        id: verify
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          python -m lmia_pipeline.nightly verify --db data/lmia.sqlite --static data/out/static \
            --started-file data/out/run_started.txt --restore data/out/restore.json --out data/out/verify.json

      # The search database (docs/hosted-search.md): D1 lmia-watch-search,
      # apart from the forms database. search-sync writes the rows whose
      # content hash differs from the ledger in the SQLite file (every row on
      # a first load or a full reload) as SQL batches and a manifest. The
      # schema goes first (every statement IF NOT EXISTS), then each batch in
      # manifest order, one Wrangler call each; D1 rolls back a batch that
      # fails, and the step stops there with every earlier batch applied in
      # full. The row count is then read back and compared with the manifest,
      # and only a match records the ledger, so a night that stopped anywhere
      # is sent again the next night. Runs only when both checks passed: the
      # ledger lives in the database, and a database that is not saved below
      # would come back the next night with a ledger behind D1. Before the R2
      # save, so the ledger travels with the database. Nothing reads this
      # database yet; a failure shows as search_sync: failed in the run status
      # and never stops the run. A first load or a full reload sends about
      # 50 batches; a normal night sends one.
      - name: Sync the search database
        id: search
        if: ${{ !cancelled() && steps.verify.outputs.export_ok == 'true' && steps.verify.outputs.db_ok == 'true' }}
        continue-on-error: true
        timeout-minutes: 60
        working-directory: site
        run: |
          out=../data/out/search
          python -m lmia_pipeline search-sync --db ../data/lmia.sqlite --out "$out"
          "$WRANGLER" d1 execute lmia-watch-search --remote --yes --file ../pipeline/search_schema.sql
          for batch in $(python -c 'import json, sys; print(" ".join(json.load(open(sys.argv[1]))["batches"]))' "$out/manifest.json"); do
            echo "Applying $batch"
            "$WRANGLER" d1 execute lmia-watch-search --remote --yes --file "$out/$batch"
          done
          "$WRANGLER" d1 execute lmia-watch-search --remote --json --command "SELECT COUNT(*) AS n FROM search_rows" > "$out/count.json"
          count=$(python -c 'import json, sys; print(int(json.load(open(sys.argv[1]))[0]["results"][0]["n"]))' "$out/count.json")
          python -m lmia_pipeline search-check --db ../data/lmia.sqlite --manifest "$out/manifest.json" --count "$count"
          python -m lmia_pipeline search-synced --db ../data/lmia.sqlite --manifest "$out/manifest.json"

      - name: Bundle the static data for the site
        id: bundle
        if: ${{ !cancelled() && steps.verify.outputs.export_ok == 'true' }}
        run: |
          rm -rf site/public/data
          cp -r data/out/static site/public/data
          tar -czf data/out/static.tar.gz -C data/out static

      # The version serving traffic before tonight's deploy, kept so a deploy
      # that breaks the site can be put back. deployments status names the
      # version carrying the traffic; versions list would also show a version
      # uploaded without being deployed. live-version passes on only a
      # well-formed version id. A failure here means no rollback tonight and
      # nothing more.
      - name: Record the live Worker version
        id: version
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        continue-on-error: true
        working-directory: site
        run: |
          mkdir -p ../data/out/deploy
          "$WRANGLER" deployments status --json > ../data/out/deploy/before.json 2> ../data/out/deploy/before.log || cat ../data/out/deploy/before.log
          python -m lmia_pipeline.nightly live-version --file ../data/out/deploy/before.json --out ../data/out/deploy/version_before.txt

      # A failed deploy leaves the live site on its previous version. The
      # asset upload (thousands of small files) meets a transient API error
      # now and then after Wrangler's own retries, so the whole deploy is
      # tried three times with a pause between; files stored by a failed
      # attempt are not uploaded again, since assets are content-addressed.
      - name: Deploy the Worker with the new data as assets
        id: deploy
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        working-directory: site
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy; then exit 0; fi
            echo "deploy attempt $attempt failed; trying again in two minutes"
            sleep 120
          done
          exit 1

      # After a deploy that worked: the home, search and data pages and one
      # employer profile (the first of stats.json's top_approvals), fetched
      # from outside with the pipeline's user agent, each page that fails
      # fetched again 30 seconds later. "ok": every page 200, and home and
      # data show tonight's data date. "broken": a page answered 500 to 599
      # both times. "unverifiable": anything else, above all a 403 or a
      # challenge page from the edge (the dashboard's rules may refuse a cloud
      # address), which is never a reason to roll back. The verdict lands in
      # the run status as smoke.
      - name: Check the live site
        id: smoke
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p data/out/deploy
          data_date=$(python -c 'import json, sys; print(json.load(open(sys.argv[1])).get("data_as_of") or "")' data/out/static/stats.json || true)
          python -m lmia_pipeline.nightly smoke --base-url "${LMIAWATCH_SITE_URL:-https://lmiawatch.ca}" \
            --data-date "$data_date" --stats data/out/static/stats.json --out data/out/deploy/smoke.json

      # Only when the Worker itself answered with server errors. A rollback
      # puts the version recorded above, with its own copy of the data, back
      # on all the traffic; bound resources (D1, R2) are not touched. The
      # database is still saved below, and the next retry trigger deploys
      # again because the run is not ok. The outcome reads "failed" until the
      # rollback has gone through. The id comes through the environment and
      # was checked as a version id, so it cannot change the command.
      - name: Roll the Worker back when the deploy broke the site
        id: rollback
        if: ${{ !cancelled() && steps.smoke.outputs.verdict == 'broken' }}
        continue-on-error: true
        working-directory: site
        env:
          VERSION_ID: ${{ steps.version.outputs.version_id }}
        run: |
          out=../data/out/deploy
          echo "failed" > "$out/rollback.txt"
          if [ -z "$VERSION_ID" ]; then
            echo "no version recorded" > "$out/rollback.txt"
            echo "No version was recorded before the deploy, so there is none to roll back to."
            exit 1
          fi
          for attempt in 1 2 3; do
            if "$WRANGLER" rollback "$VERSION_ID" --message "Nightly smoke test failed after the deploy" --yes; then
              echo "rolled back" > "$out/rollback.txt"
              exit 0
            fi
            echo "rollback attempt $attempt failed; trying again in 30 seconds"
            sleep 30
          done
          exit 1

      # IndexNow (docs/search-engines.md, section 5): Bing and the other engines
      # that take it (Google does not) hear about tonight's changed pages
      # without waiting for a crawl. The command sends the employer pages whose
      # row changed since the run's start (run_started.txt, written as the
      # pipeline step began, in the same form as employers.updated_at) and the
      # pages that follow the nightly data, at most 20,000 a night in batches
      # of 10,000, to api.indexnow.org. An engine checks the request against
      # the key file at the site's root (site/public/<key>.txt), which this
      # deploy has just published; the key is in the code, so no secret is
      # needed. Only after a deploy that worked and was not found broken, so
      # the engines are pointed at pages the site serves. "failed" is written
      # first, so a step stopped by its time limit reads as failed. Exits 1
      # only on a rejection (the step shows red; an attention item); a rate
      # limit or an outage is recorded and nothing more. Never stops the run.
      # INDEXNOW_ENABLED=false turns it off.
      - name: Tell IndexNow which pages changed
        id: indexnow
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.smoke.outputs.verdict != 'broken' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          INDEXNOW_ENABLED: ${{ vars.INDEXNOW_ENABLED }}
        run: |
          out=data/out/indexnow
          mkdir -p "$out"
          echo "failed" > "$out/last_outcome.txt"
          if [ "$INDEXNOW_ENABLED" = "false" ]; then
            echo "INDEXNOW_ENABLED is false; nothing sent."
            echo "off" > "$out/last_outcome.txt"
            exit 0
          fi
          since=$(cat data/out/run_started.txt 2>/dev/null || true)
          python -m lmia_pipeline.nightly indexnow --db data/lmia.sqlite --since "$since" \
            --site-url "${LMIAWATCH_SITE_URL:-https://lmiawatch.ca}"

      # After the deploy, so the link shows the postings the digest counts, and
      # before the R2 save, so the recorded post date travels with the database.
      # Opt-in (X_POST_ENABLED) because every post costs credits. Skips without
      # the X secrets and never fails the run: the post is optional, the save is
      # not. A refused post exits 1 so this step shows red while the run goes
      # on, and LAST_RUN.md records the outcome. The pipeline refuses a second
      # post for the same Job Bank pass, so a re-run cannot post twice. Not
      # after a deploy the smoke test found broken (rolled back or not): the
      # post would point at data the site does not show, and the retry that
      # deploys again posts then.
      - name: Post the daily digest to X (only when X_POST_ENABLED is true)
        if: ${{ !cancelled() && vars.X_POST_ENABLED == 'true' && steps.deploy.outcome == 'success' && steps.smoke.outputs.verdict != 'broken' }}
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LINK: ${{ vars.X_POST_LINK == 'true' && '--link' || '' }}
        run: |
          if [ -z "$X_API_KEY" ] || [ -z "$X_API_SECRET" ] || [ -z "$X_ACCESS_TOKEN" ] || [ -z "$X_ACCESS_TOKEN_SECRET" ]; then
            echo "The X secrets are not set; no post."
            exit 0
          fi
          python -m lmia_pipeline post-digest --db data/lmia.sqlite $LINK

      # The same digest and card on Bluesky, with the link (posting there is
      # free). Same shape as the X step: after the deploy, before the R2 save
      # so the recorded post date travels with the database, opt-in through
      # BSKY_POST_ENABLED, skipped without the two secrets, and never fails the
      # run. Bluesky keeps its own record of the pass it posted, so each
      # platform posts a pass at most once whatever the other did.
      - name: Post the daily digest to Bluesky (only when BSKY_POST_ENABLED is true)
        id: bluesky
        if: ${{ !cancelled() && vars.BSKY_POST_ENABLED == 'true' && steps.deploy.outcome == 'success' && steps.smoke.outputs.verdict != 'broken' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          if [ -z "$BSKY_HANDLE" ] || [ -z "$BSKY_APP_PASSWORD" ]; then
            echo "The Bluesky secrets are not set; no post."
            exit 0
          fi
          python -m lmia_pipeline post-bluesky --db data/lmia.sqlite

      # A citable release: when a new ESDC quarter has been loaded (or no
      # record exists yet), a new version of the Zenodo record with the Open
      # Government Licence files from tonight's export. After the deploy, so
      # the deposit matches the files the site serves; before the R2 save, so
      # the recorded DOIs travel with the database. Skipped without
      # ZENODO_TOKEN; ZENODO_SANDBOX=true sends it to sandbox.zenodo.org. A
      # failure discards the draft, is reported in the run status, and is
      # tried again the next night; it never stops the save. Before any draft
      # the step asks Zenodo what it already holds, so a version whose publish
      # answer or database save was lost is adopted, never published twice.
      # Not after a broken deploy, for the same reason as the posts.
      - name: Deposit a new ESDC quarter on Zenodo (only when ZENODO_TOKEN is set)
        id: zenodo
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.smoke.outputs.verdict != 'broken' }}
        continue-on-error: true
        timeout-minutes: 30
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_SANDBOX: ${{ vars.ZENODO_SANDBOX }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "ZENODO_TOKEN is not set; no deposit."
            exit 0
          fi
          python -m lmia_pipeline deposit-zenodo --db data/lmia.sqlite --csv-dir data/out/csv

      # Only a database that passed its checks is saved, whether or not the
      # deploy worked, so a night's Job Bank observations are kept even when
      # the site could not be updated. Last night's backup becomes the previous
      # one first; when the run started from the previous one (the newest was
      # damaged) that copy is left as it is.
      # The pack copies the database with VACUUM INTO (which also takes rows
      # still in the write-ahead log), drops the secondary indexes, checks the
      # copy and gzips it. It stops the step when the file would be above the
      # 300 MiB one Wrangler upload accepts, so R2 keeps the previous backup
      # rather than being sent a file it refuses.
      - name: Save the database to R2
        id: save_db
        if: ${{ !cancelled() && steps.verify.outputs.db_ok == 'true' }}
        run: |
          python -m lmia_pipeline.nightly pack --db data/lmia.sqlite --out data/out/lmia.sqlite.gz
          source=$(python -c 'import json; print(json.load(open("data/out/restore.json"))["source"])')
          if [ "$source" = "backup" ]; then
            "$WRANGLER" r2 object put --remote "$BUCKET/lmia.sqlite.prev.gz" --file data/restore/lmia.sqlite.gz
          fi
          "$WRANGLER" r2 object put --remote "$BUCKET/lmia.sqlite.gz" --file data/out/lmia.sqlite.gz

      # Weekly snapshots, kept eight weeks. The nightly save keeps only tonight's
      # backup and the previous night's, so a fault noticed later than that would
      # reach every copy. Sundays (UTC) only; the slot is the count of whole weeks
      # since 1970-01-01 modulo 8, so each snapshot replaces the one from eight
      # weeks before and nothing has to be listed or pruned. The ISO week number
      # served before and restarts each year, which put weeks 53 and 5 in one
      # slot. The site's own D1 tables (forms, donations) go with it. The
      # operator's machine pulls the newest backup and the D1 export into a
      # folder off this account each week.
      - name: Weekly snapshot (Sundays UTC, kept eight weeks)
        id: snapshot
        if: ${{ !cancelled() && steps.save_db.outcome == 'success' }}
        continue-on-error: true
        working-directory: site
        run: |
          if [ "$(date -u +%u)" != "7" ]; then echo "Not Sunday (UTC); no snapshot tonight."; exit 0; fi
          slot=$(( $(date -u +%s) / 604800 % 8 ))
          "$WRANGLER" r2 object put --remote "$BUCKET/backups/weekly/db-slot-$slot.sqlite.gz" --file ../data/out/lmia.sqlite.gz
          "$WRANGLER" d1 export lmia-watch --remote --output ../data/out/d1.sql
          gzip -c ../data/out/d1.sql > ../data/out/d1.sql.gz
          "$WRANGLER" r2 object put --remote "$BUCKET/backups/weekly/d1-slot-$slot.sql.gz" --file ../data/out/d1.sql.gz
          "$WRANGLER" r2 object put --remote "$BUCKET/backups/weekly/d1-latest.sql.gz" --file ../data/out/d1.sql.gz
          date -u +"%Y-%m-%d" > ../data/out/slot.txt
          "$WRANGLER" r2 object put --remote "$BUCKET/backups/weekly/slot-$slot.txt" --file ../data/out/slot.txt
          echo "Snapshot saved to slot $slot."

      # The downloads and the bundle match what was deployed, so they are saved
      # only after a deploy that worked and was not found broken.
      - name: Save the public files to R2
        id: save_files
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.smoke.outputs.verdict != 'broken' }}
        # Each upload is tried three times, 20, 40 and 60 seconds apart: the
        # API answers an occasional 524 on a single put (2026-10-26), and one
        # such answer must not leave the rest of the files a day old. A file
        # still failing after three tries is named, the loop goes on, and the
        # step fails at the end so the attention item says so.
        run: |
          put() {
            local attempt
            for attempt in 1 2 3; do
              if "$WRANGLER" r2 object put --remote "$1" --file "$2"; then return 0; fi
              echo "::warning::upload of $1 failed (attempt $attempt of 3)"
              sleep $((20 * attempt))
            done
            return 1
          }
          failed=""
          put "$BUCKET/static.tar.gz" data/out/static.tar.gz || failed="$failed static.tar.gz"
          for f in data/out/csv/*.csv; do
            put "$BUCKET/downloads/$(basename "$f")" "$f" || failed="$failed $(basename "$f")"
          done
          for f in data/out/mirror/*; do
            put "$BUCKET/mirror/$(basename "$f")" "$f" || failed="$failed $(basename "$f")"
          done
          if [ -n "$failed" ]; then
            echo "::error::not saved to R2 after three tries:$failed"
            exit 1
          fi

      # The audience counts (docs/search-engines.md, section 6). Analytics
      # Engine keeps the Worker's data points for three months; this keeps
      # them for good, as one CSV per finished UTC day and one row per day in
      # views/summary.csv, both in R2. rollup-views asks the SQL API for every
      # day after the newest one the summary holds (normally only yesterday;
      # all three months on the first night), so a night that failed is caught
      # up by the next, and writes the days it rolled up to rolled_up.txt for
      # the upload loop. It reads with CLOUDFLARE_ANALYTICS_TOKEN, a token of
      # its own with Account Analytics Read and nothing else (the deploy token
      # cannot read analytics); without it the step does nothing. On the night
      # that rolls up a month's last day it also reads the X follower count
      # once (a billed read), only when X posting is enabled; the employer and
      # record counts come from tonight's data/out/static/stats.json. The summary
      # is downloaded first and appended to: a download that fails for any
      # reason but "does not exist" stops the step, so a summary R2 holds is
      # never replaced by a shorter one. The outcome reads "failed" until both
      # files are in R2, so a step stopped anywhere (its time limit included)
      # reads as failed. It never stops the run and needs nothing else above.
      - name: Roll up the audience counts (only when CLOUDFLARE_ANALYTICS_TOKEN is set)
        id: views
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          X_POST_ENABLED: ${{ vars.X_POST_ENABLED }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          out=data/out/views
          mkdir -p "$out"
          echo "failed" > "$out/last_outcome.txt"
          if [ -z "$CLOUDFLARE_ANALYTICS_TOKEN" ]; then
            echo "no analytics token; nothing rolled up"
            echo "no token" > "$out/last_outcome.txt"
            exit 0
          fi
          rm -f "$out/summary.csv"
          got=""
          for attempt in 1 2 3; do
            if "$WRANGLER" r2 object get --remote "$BUCKET/views/summary.csv" --file "$out/summary.csv" > "$out/summary.log" 2>&1; then
              got=yes
              break
            fi
            if grep -qi "specified key does not exist" "$out/summary.log"; then
              got=missing
              rm -f "$out/summary.csv"
              break
            fi
            sleep 20
          done
          if [ -z "$got" ]; then
            echo "views/summary.csv could not be downloaded; nothing rolled up"
            cat "$out/summary.log"
            exit 1
          fi
          python -m lmia_pipeline rollup-views --out "$out"
          while read -r day; do
            "$WRANGLER" r2 object put --remote "$BUCKET/views/$day.csv" --file "$out/$day.csv"
          done < "$out/rolled_up.txt"
          if [ -s "$out/rolled_up.txt" ]; then
            "$WRANGLER" r2 object put --remote "$BUCKET/views/summary.csv" --file "$out/summary.csv"
            echo "rolled up" > "$out/last_outcome.txt"
          else
            echo "no data" > "$out/last_outcome.txt"
          fi

      # Search Console's figures (docs/search-engines.md, section 6): clicks,
      # impressions, position and the top 50 queries of every final day after
      # the newest in views/search_console.csv, appended to it. Google keeps
      # 16 months; this keeps them for good. It signs in with the service
      # account key in GSC_SERVICE_ACCOUNT_JSON (read-only scope); without it
      # the outcome is "no credentials" and nothing is asked. The file is
      # downloaded first and appended to, and a download that fails for any
      # reason but "does not exist" stops the step, so a shorter file never
      # replaces it. The outcome reads "failed" until the file is in R2. It
      # never stops the run.
      - name: Import the Search Console figures (only when GSC_SERVICE_ACCOUNT_JSON is set)
        id: gsc
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
        run: |
          out=data/out/search_console
          mkdir -p "$out"
          echo "failed" > "$out/last_outcome.txt"
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "Search Console: no credentials"
            echo "no credentials" > "$out/last_outcome.txt"
            exit 0
          fi
          rm -f "$out/search_console.csv"
          got=""
          for attempt in 1 2 3; do
            if "$WRANGLER" r2 object get --remote "$BUCKET/views/search_console.csv" --file "$out/search_console.csv" > "$out/get.log" 2>&1; then
              got=yes
              break
            fi
            if grep -qi "specified key does not exist" "$out/get.log"; then
              got=missing
              rm -f "$out/search_console.csv"
              break
            fi
            sleep 20
          done
          if [ -z "$got" ]; then
            echo "views/search_console.csv could not be downloaded; nothing imported"
            cat "$out/get.log"
            exit 1
          fi
          python -m lmia_pipeline import-search-console --out "$out"
          outcome=$(cat "$out/outcome.txt")
          case "$outcome" in
            imported*)
              "$WRANGLER" r2 object put --remote "$BUCKET/views/search_console.csv" --file "$out/search_console.csv"
              ;;
          esac
          echo "$outcome" > "$out/last_outcome.txt"

      # The monthly audience report (docs/search-engines.md, section 6): on
      # the first run of a UTC month, views/report-<YYYY-MM>.md for the month
      # just ended, from the summary and the Search Console file as R2 holds
      # them after the two steps above, with the three months before it
      # beside it. Every night this asks R2 whether last month's report
      # exists ("not due" when it does), so a night that fails is made up by
      # the next. The report waits up to a week for the month's last day to
      # be rolled up ("waiting"). Its one-line summary goes to LAST_RUN.md.
      # It never stops the run.
      - name: Write the monthly audience report (the first run of a month)
        id: report
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          out=data/out/report
          mkdir -p "$out"
          echo "failed" > "$out/last_outcome.txt"
          month=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          fetch() {
            # 0 when downloaded, 2 when R2 says it does not exist, 1 otherwise.
            local attempt
            for attempt in 1 2 3; do
              if "$WRANGLER" r2 object get --remote "$BUCKET/$1" --file "$2" > "$out/get.log" 2>&1; then return 0; fi
              if grep -qi "specified key does not exist" "$out/get.log"; then rm -f "$2"; return 2; fi
              sleep 20
            done
            cat "$out/get.log"
            return 1
          }
          code=0; fetch "views/report-$month.md" "$out/existing.md" || code=$?
          if [ "$code" = "0" ]; then echo "not due" > "$out/last_outcome.txt"; exit 0; fi
          if [ "$code" = "1" ]; then echo "views/report-$month.md could not be checked"; exit 1; fi
          code=0; fetch views/summary.csv "$out/summary.csv" || code=$?
          if [ "$code" = "1" ]; then exit 1; fi
          code=0; fetch views/search_console.csv "$out/search_console.csv" || code=$?
          if [ "$code" = "1" ]; then exit 1; fi
          python -m lmia_pipeline views-report --month "$month" --summary "$out/summary.csv" \
            --search "$out/search_console.csv" --out "$out"
          outcome=$(cat "$out/outcome.txt")
          if [ "$outcome" = "written" ]; then
            "$WRANGLER" r2 object put --remote "$BUCKET/views/report-$month.md" --file "$out/report-$month.md"
          fi
          echo "$outcome" > "$out/last_outcome.txt"

      - name: Save the download cache
        if: ${{ always() && steps.pipeline.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/raw/cache
          key: raw-cache-${{ github.run_id }}

      # On the first of a month (UTC), whichever run gets there: the status
      # and expiry date of the deploy token and of the analytics token (when
      # set), through the API's token verify call, and the domain's
      # registration (expiry date, auto-renew) through the registrar API. A
      # date inside 30 days, or a token that is not active, is an attention
      # item; an answer the token has no permission for, or no answer, is
      # "unknown" and nothing more. Every other day it writes "not due". The
      # results go to the run status as checks; no token is ever printed.
      - name: Monthly expiry checks (the first of a month)
        id: checks
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          mkdir -p data/out
          python -m lmia_pipeline.nightly checks --today "$(date -u +%Y-%m-%d)" --out data/out/checks.json

      # What the daily check in the Worker and the next retry's gate read: when
      # the run finished, which stages and steps succeeded (every step's
      # outcome under steps), the notices (information, never failures or
      # items needing attention), where the international-candidates pass, the
      # designated-employer lists and the government notices stand (each
      # notice first listed tonight is one of the notices), what the checks
      # found, the outcomes of the X
      # post, the Bluesky post, the Zenodo deposit, the search database sync,
      # the audience roll-up, the Search Console import, the monthly report
      # and the IndexNow submission, where the database
      # came from (restore), the smoke test and any rollback, and the expiry
      # checks. Written whatever happened above. The Bluesky, Zenodo,
      # search-sync, roll-up, Search Console, report, IndexNow and rollback
      # steps write "failed" before they start, so a step stopped by its time
      # limit still reads as failed.
      - name: Write the run status
        if: ${{ always() }}
        run: |
          python -m lmia_pipeline.nightly status --db data/lmia.sqlite \
            --started-file data/out/run_started.txt --verify data/out/verify.json \
            --outcome data/out/social/last_outcome.txt \
            --bluesky-outcome data/out/social/bluesky_outcome.txt \
            --zenodo-outcome data/out/zenodo/last_outcome.txt \
            --search-outcome data/out/search/last_outcome.txt \
            --views-outcome data/out/views/last_outcome.txt \
            --indexnow-outcome data/out/indexnow/last_outcome.txt \
            --search-console-outcome data/out/search_console/last_outcome.txt \
            --views-report-outcome data/out/report/last_outcome.txt \
            --restore data/out/restore.json --smoke data/out/deploy/smoke.json \
            --rollback-outcome data/out/deploy/rollback.txt --version-before data/out/deploy/version_before.txt \
            --checks data/out/checks.json \
            --step "restore=${{ steps.restore.outcome }}" --step "pipeline=${{ steps.pipeline.outcome }}" \
            --step "verify=${{ steps.verify.outcome }}" --step "deploy=${{ steps.deploy.outcome }}" \
            --step "save_db=${{ steps.save_db.outcome }}" --step "save_files=${{ steps.save_files.outcome }}" \
            --out data/out/status.json

      - name: Save the run status to R2
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ -f data/out/status.json ]; then
            "$WRANGLER" r2 object put --remote "$BUCKET/status.json" --file data/out/status.json
          fi

      # main may have moved while the job ran (a code change pushed during the
      # night), so the record is put on top of it before the push. A deploy
      # the smoke test found broken is not a successful refresh.
      - name: Record the run so the schedule stays enabled
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.smoke.outputs.verdict != 'broken' }}
        continue-on-error: true
        run: |
          date -u +"Last successful refresh: %Y-%m-%d %H:%M UTC" > LAST_RUN.md
          if [ -f data/out/social/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "X post: $(cat data/out/social/last_outcome.txt)" >> LAST_RUN.md
          fi
          if [ -f data/out/social/bluesky_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "Bluesky post: $(cat data/out/social/bluesky_outcome.txt)" >> LAST_RUN.md
          fi
          if [ -f data/out/zenodo/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "Zenodo deposit: $(cat data/out/zenodo/last_outcome.txt)" >> LAST_RUN.md
          fi
          if [ -f data/out/search/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "Search database sync: $(cat data/out/search/last_outcome.txt)" >> LAST_RUN.md
          fi
          if [ -f data/out/views/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "Audience roll-up: $(cat data/out/views/last_outcome.txt)" >> LAST_RUN.md
          fi
          if [ -f data/out/search_console/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "Search Console: $(cat data/out/search_console/last_outcome.txt)" >> LAST_RUN.md
          fi
          # The monthly report's one line, only on the run that wrote it (or tried and failed).
          report_outcome=$(cat data/out/report/last_outcome.txt 2>/dev/null || true)
          if [ "$report_outcome" = "written" ] && [ -f data/out/report/summary_line.txt ]; then
            echo "" >> LAST_RUN.md
            echo "Audience report: $(cat data/out/report/summary_line.txt)" >> LAST_RUN.md
          elif [ "$report_outcome" = "failed" ]; then
            echo "" >> LAST_RUN.md
            echo "Audience report: failed" >> LAST_RUN.md
          fi
          if [ -f data/out/indexnow/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "IndexNow: $(cat data/out/indexnow/last_outcome.txt)" >> LAST_RUN.md
          fi
          if [ -f data/out/intl/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "Open to international candidates: $(cat data/out/intl/last_outcome.txt)" >> LAST_RUN.md
          fi
          if [ -f data/out/registers/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "Designated-employer lists: $(cat data/out/registers/last_outcome.txt)" >> LAST_RUN.md
          fi
          if [ -f data/out/notices/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "Government notices: $(cat data/out/notices/last_outcome.txt)" >> LAST_RUN.md
          fi
          # The run's notices, one per line with its full text (nothing when
          # there are none); a fault here leaves them out of the record only.
          python -m lmia_pipeline.nightly notices --status data/out/status.json > data/out/notices.md 2>/dev/null || true
          if [ -s data/out/notices.md ]; then
            echo "" >> LAST_RUN.md
            cat data/out/notices.md >> LAST_RUN.md
          fi
          git config user.name "LMIA Watch"
          git config user.email "ops@lmiawatch.invalid"
          git add LAST_RUN.md
          if git diff --cached --quiet; then exit 0; fi
          TZ=UTC git commit -m "refresh: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin main && git push origin HEAD:main; then exit 0; fi
            sleep 15
          done
          exit 1

      # Last, after everything is saved and recorded: fail the run when an item
      # needs attention, so GitHub's failed-workflow email reaches the operator
      # as well as the Worker's own daily check. The items (attention_items in
      # lmia_pipeline/resilience.py) also go to one open issue labelled
      # run-attention: the first run with items opens it, each later run
      # replaces its text and adds a comment, and the first run with none
      # closes it with a comment naming that run. The issue calls run with
      # set +e and never change the exit code, so a GitHub API fault costs the
      # issue, never the email. The label is created (or left as it is) each
      # time, so nothing has to be set up by hand. PYTHONPATH lets the helper
      # run even if the pipeline install failed. The run's notices are printed
      # in the step's log and never counted: they neither fail the step nor
      # open the issue.
      - name: Items needing attention
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: run-attention
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          set +e
          out=data/out/attention
          python -m lmia_pipeline.nightly attention --status data/out/status.json --run-url "$RUN_URL" --out-dir "$out"
          code=$?
          soft() {
            if ! gh "$@" --repo "$GITHUB_REPOSITORY" > /dev/null; then
              echo "::warning::gh $1 $2 failed; the run-attention issue was not updated"
            fi
          }
          soft label create "$LABEL" --color B60205 --description "Opened by the nightly run while an item needs attention" --force
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -s "$out/items.txt" ]; then
            if [ -n "$open" ]; then
              soft issue edit "$open" --body-file "$out/body.md"
              soft issue comment "$open" --body-file "$out/comment.md"
            else
              soft issue create --title "$(cat "$out/title.txt")" --label "$LABEL" --body-file "$out/body.md"
            fi
          elif [ "$code" = "0" ] && [ -n "$open" ]; then
            soft issue close "$open" --reason completed --comment "$(cat "$out/close.md")"
          fi
          exit $code
