# The one and only trigger: a scheduled run at midnight UTC. There is no manual
# trigger, no push trigger, and nothing on the site can start a run. Code on
# main ships with the next scheduled run, because this job deploys the Worker
# from the checked-out tree after the data stage.
#
# Steps: restore the SQLite file from R2, run every pipeline stage (the
# pipeline itself skips Job Bank if it already ran within the last 20 hours),
# bundle the static JSON, deploy the Worker with that data as its assets, post
# the daily digest to X when its secrets exist, save the database and the
# public files back to R2.
#
# Secrets on the project account: CLOUDFLARE_API_TOKEN (Workers + R2 + D1),
# CLOUDFLARE_ACCOUNT_ID. Optional: X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN,
# X_ACCESS_TOKEN_SECRET (the X post; without them the step does nothing).
# Variables: SITE_URL, CONTACT (the scraper's user agent); X_POST_ENABLED must be
# "true" for the X step to run at all (X posting is pay-per-use, so it is opt-in);
# optional X_POST_LINK, set to true to put the site link in the text (X bills a
# post with a link at thirteen times the rate; the attached card carries the
# address instead).
# The repository can be private: a private repository gets 2,000 free Actions
# minutes a month and this run uses about 45 to 55 a night.

name: nightly

on:
  schedule:
    - cron: "0 0 * * *"

# contents: write only so the last step can record the run date; GitHub pauses
# a schedule after 60 days without repository activity.
permissions:
  contents: write

# Never let two runs overlap, even if one is delayed past the next schedule.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LMIAWATCH_SITE_URL: ${{ vars.SITE_URL }}
      LMIAWATCH_CONTACT: ${{ vars.CONTACT }}
    steps:
      # Fail in seconds, not after an hour of crawling, until the account is wired up.
      - name: Check that the Cloudflare secrets exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; nothing to do."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Editable, because config.py finds schema.sql and data/ relative to its own
      # file; a regular install would look for them inside site-packages.
      - name: Install the pipeline
        run: pip install -e ./pipeline

      # The database travels gzipped: the raw file is above the single-object
      # size the command-line upload accepts, and it compresses about three to one.
      # --remote on every r2 command: without it Wrangler 4 reads and writes a
      # local simulated bucket on the runner, which is thrown away with the job.
      - name: Restore the database from R2 (first run has none)
        continue-on-error: true
        run: |
          npx --yes wrangler r2 object get --remote lmia-watch-data/lmia.sqlite.gz --file data/lmia.sqlite.gz
          gunzip -f data/lmia.sqlite.gz

      # 200 posting pages a night keeps a run near 45 to 55 minutes, which fits a
      # private repository's 2,000 free Actions minutes a month with room to spare.
      - name: Run every stage
        run: |
          mkdir -p data/out
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/out/run_started.txt
          python -m lmia_pipeline run --db data/lmia.sqlite --detail-budget 200

      - name: Bundle the static data for the site
        run: |
          rm -rf site/public/data
          cp -r data/out/static site/public/data
          tar -czf data/out/static.tar.gz -C data/out static

      - name: Deploy the Worker with the new data as assets
        working-directory: site
        run: |
          npm ci
          npx wrangler deploy

      # After the deploy, so the link shows the postings the digest counts, and
      # before the R2 save, so the recorded post date travels with the database.
      # Opt-in (X_POST_ENABLED) because every post costs credits. Skips without
      # the X secrets and never fails the run: the post is optional, the save is
      # not. A refused post exits 1 so this step shows red while the run goes
      # on, and LAST_RUN.md records the outcome. The pipeline refuses a second
      # post for the same Job Bank pass, so a re-run cannot post twice.
      - name: Post the daily digest to X (only when X_POST_ENABLED is true)
        if: vars.X_POST_ENABLED == 'true'
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LINK: ${{ vars.X_POST_LINK == 'true' && '--link' || '' }}
        run: |
          if [ -z "$X_API_KEY" ] || [ -z "$X_API_SECRET" ] || [ -z "$X_ACCESS_TOKEN" ] || [ -z "$X_ACCESS_TOKEN_SECRET" ]; then
            echo "The X secrets are not set; no post."
            exit 0
          fi
          python -m lmia_pipeline post-digest --db data/lmia.sqlite $LINK

      # What the daily check in the Worker reads: when the run finished, which
      # stages succeeded, and the X post's outcome.
      - name: Write the run status
        run: |
          python - <<'PY'
          import json, sqlite3, datetime, pathlib
          conn = sqlite3.connect("data/lmia.sqlite")
          start = pathlib.Path("data/out/run_started.txt").read_text().strip()
          rows = conn.execute("SELECT source, ok, detail FROM sources_log WHERE run_at >= ? ORDER BY id", (start,)).fetchall()
          outcome = pathlib.Path("data/out/social/last_outcome.txt")
          status = {
              "run_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "stages": [{"source": s, "ok": bool(ok), "detail": (d or "")[:200]} for s, ok, d in rows],
              "x_post": outcome.read_text().strip() if outcome.exists() else "not run",
          }
          status["ok"] = all(x["ok"] for x in status["stages"])
          pathlib.Path("data/out/status.json").write_text(json.dumps(status, indent=1))
          print(json.dumps(status, indent=1))
          PY

      - name: Save the database and public files to R2
        run: |
          gzip -c data/lmia.sqlite > data/out/lmia.sqlite.gz
          npx --yes wrangler r2 object put --remote lmia-watch-data/lmia.sqlite.gz --file data/out/lmia.sqlite.gz
          npx --yes wrangler r2 object put --remote lmia-watch-data/static.tar.gz --file data/out/static.tar.gz
          npx --yes wrangler r2 object put --remote lmia-watch-data/status.json --file data/out/status.json
          for f in data/out/csv/*.csv; do
            npx --yes wrangler r2 object put --remote "lmia-watch-data/downloads/$(basename "$f")" --file "$f"
          done
          for f in data/out/mirror/*; do
            npx --yes wrangler r2 object put --remote "lmia-watch-data/mirror/$(basename "$f")" --file "$f"
          done

      - name: Record the run so the schedule stays enabled
        run: |
          date -u +"Last successful refresh: %Y-%m-%d %H:%M UTC" > LAST_RUN.md
          if [ -f data/out/social/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "X post: $(cat data/out/social/last_outcome.txt)" >> LAST_RUN.md
          fi
          git config user.name "LMIA Watch"
          git config user.email "ops@lmiawatch.invalid"
          git add LAST_RUN.md
          git diff --cached --quiet || TZ=UTC git commit -m "refresh: $(date -u +%Y-%m-%d)"
          git push

      # Last, after everything is saved and recorded: fail the run when an item
      # needs attention, so GitHub's failed-workflow email reaches the operator
      # as well as the Worker's own daily check.
      - name: Items needing attention
        run: |
          python - <<'PY'
          import json, pathlib, sys
          s = json.loads(pathlib.Path("data/out/status.json").read_text())
          items = [f"stage {x['source']} failed: {x['detail']}" for x in s["stages"] if not x["ok"]]
          if s["x_post"] in ("failed", "no credentials"):
              items.append(f"X post: {s['x_post']}")
          for i in items:
              print("ATTENTION:", i)
          sys.exit(1 if items else 0)
          PY
